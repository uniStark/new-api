# Drawia fork — build + publish new-api docker image to GHCR.
#
# Triggers:
#   - tag push matching "drawia-v*" (e.g., drawia-v1.0.0-rc.5-num6)
#   - manual workflow_dispatch from the Actions tab
#
# Published image: ghcr.io/unistark/new-api:<tag>
# Tag points at GHCR-stored image — pull on fly with:
#   docker pull ghcr.io/unistark/new-api:drawia-v1.0.0-rc.5-num6
#
# Notes:
#   - The base new-api Dockerfile builds 2 bun frontends + go binary;
#     full clean build ~5 min on GitHub-hosted runners.
#   - GOPROXY=goproxy.cn is baked into the Dockerfile for CN-network
#     builders. GitHub Actions runners are in US/EU — goproxy.cn still
#     responds quickly from them; no override needed.

name: drawia-build

on:
  push:
    tags:
      - "drawia-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag suffix (e.g. drawia-v1.0.0-rc.5-num6)"
        required: true
        default: "drawia-manual-build"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          # GHCR repo names must be lowercase; the owner login may be mixed case.
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${OWNER_LC}/new-api:${TAG}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Output
        run: |
          echo "::notice::Image published → ${{ steps.meta.outputs.image }}"
          echo "Pull on target host:"
          echo "  docker pull ${{ steps.meta.outputs.image }}"
